{% extends 'base.html' %}
{% block content %}
<div style="max-width: 400px; margin: 80px auto; padding: 32px; background: white; border-radius: 12px; border: 1px solid #E2E8F0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
    <h2 style="margin-bottom: 24px; text-align: center;">Welcome Back</h2>
    <form method="POST" action="{{ url_for('auth.login') }}">
        <div style="margin-bottom: 16px;">
            <label style="display: block; margin-bottom: 6px; font-weight: 600;">Email Address</label>
            <input type="email" name="email" required style="width: 100%; padding: 10px; border: 1px solid #CBD5E1; border-radius: 6px;">
        </div>
        <div style="margin-bottom: 24px;">
            <label style="display: block; margin-bottom: 6px; font-weight: 600;">Password</label>
            <input type="password" name="password" required style="width: 100%; padding: 10px; border: 1px solid #CBD5E1; border-radius: 6px;">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">Sign In</button>
    </form>
</div>
{% endblock %}
