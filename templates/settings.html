{% extends 'base.html' %}
{% block content %}
<div style="max-width: 600px; margin: 40px auto; padding: 0 24px;">
    <h1 style="margin-bottom: 24px;">Profile Settings</h1>
    
    <div style="background: white; padding: 24px; border-radius: 8px; border: 1px solid #E2E8F0; margin-bottom: 24px;">
        <h3>Update Account Information</h3>
        <form method="POST" action="{{ url_for('auth.settings') }}" style="margin-top: 16px;">
            <input type="hidden" name="action" value="update_profile">
            <div style="margin-bottom: 16px;">
                <label style="display: block; margin-bottom: 4px;">Name</label>
                <input type="text" name="name" value="{{ g.user['name'] }}" required style="width: 100%; padding: 8px;">
            </div>
            <div style="margin-bottom: 16px;">
                <label style="display: block; margin-bottom: 4px;">Email</label>
                <input type="email" name="email" value="{{ g.user['email'] }}" required style="width: 100%; padding: 8px;">
            </div>
            <button type="submit" class="btn btn-primary">Update Profile</button>
        </form>
    </div>
</div>
{% endblock %}
