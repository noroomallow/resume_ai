<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ resume.full_name }} — Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 0; }
        .hero { padding: 100px 24px; text-align: center; max-width: 800px; margin: 0 auto; }
        .hero h1 { font-size: 3rem; margin-bottom: 12px; }
        .hero p { font-size: 1.25rem; color: #94a3b8; }
        .section { max-width: 900px; margin: 60px auto; padding: 0 24px; }
        .card { background: #1e293b; padding: 24px; border-radius: 8px; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="hero">
        <h1>{{ resume.full_name }}</h1>
        <p>{{ resume.professional_title }}</p>
        <p style="margin-top: 16px; font-size: 1rem;">{{ resume.summary }}</p>
    </div>

    <div class="section">
        <h2 style="border-bottom: 2px solid #6366f1; padding-bottom: 8px; margin-bottom: 24px;">Experience</h2>
        {% for exp in resume.experience %}
            <div class="card">
                <h3>{{ exp.position }}</h3>
                <p style="color: #6366f1;">{{ exp.company }}</p>
                <p style="font-size: 0.9rem; color: #94a3b8;">{{ exp.description }}</p>
            </div>
        {% endfor %}
    </div>
</body>
</html>
